<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wo ist? · Schlag den Daniel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#0b1030;--card:#161d4d;--line:#2c3577;--fg:#f3f1ea;--gold:#ffd24a;--p1:#ff7a1a;--p2:#2bdccb;--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Barlow","Segoe UI",system-ui,sans-serif;font-weight:500}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--gold)}
#q{font-family:var(--display);font-size:clamp(1.5rem,4.2vw,3.4rem);font-weight:900;letter-spacing:.03em;text-transform:uppercase;line-height:1}
#timer{font-family:var(--display);font-weight:900;font-size:clamp(2rem,6vw,4.4rem);line-height:.9;color:var(--gold);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
#timer.low{color:var(--p1)}
#score{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,3rem);font-weight:900;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;line-height:1}
#map{flex:1;min-height:0;background:#0a1a3a}
footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--card)}
#msg{flex:1;min-width:160px;font-size:clamp(1rem,2vw,1.5rem)}
button{font:inherit;font-weight:700;padding:12px 18px;border:0;border-radius:4px;background:var(--gold);color:#2a1d00;cursor:pointer}
button.s{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
#pick{padding:24px;display:grid;gap:12px;max-width:420px;margin:auto}
#pick a{display:block;padding:16px;border-radius:4px;background:var(--card);color:var(--fg);text-decoration:none;font-family:var(--display);font-weight:900;font-size:1.6rem;text-transform:uppercase;letter-spacing:.04em;border-left:8px solid var(--gold)}
.leaflet-tooltip{font-family:"Barlow","Segoe UI",sans-serif;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header><div id="q">Wo ist?</div><div id="timer" hidden></div><div id="score"></div></header>
  <div id="pick" hidden></div>
  <div id="map"></div>
  <footer>
    <div id="msg"></div>
    <button id="bSubmit" hidden>Tipp abgeben</button>
    <button id="bNext" hidden>Nächste Runde</button>
    <button id="bTimer" hidden>Timer starten</button>
    <button id="bReveal" class="s" hidden>Jetzt aufdecken</button>
    <button id="bP1" class="s" hidden>+1 Daniel</button>
    <button id="bP2" class="s" hidden>+1 Gäste</button>
    <button id="bReset" class="s" hidden>Neustart</button>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,set,update,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== 1. HIER DEINE FIREBASE-WERTE EINTRAGEN ===== */
const CONFIG = {
  apiKey: "AIzaSyAr96tAGZyNnHRbanOYOtiOwnTvTHSCk9Y",
  authDomain: "schlag-den-daniel.firebaseapp.com",
  databaseURL: "https://schlag-den-daniel-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "schlag-den-daniel",
  appId: "1:807315940901:web:095f46aac81d70fbe001cc"
};

/* ===== 2. ORTE (n = Name, k = Art, lat/lng) – beliebig erweiterbar ===== */
const PLACES = [
  {n:"München",k:"Stadt",lat:48.14,lng:11.58,probe:true},   // Probe-Runde, zählt nicht
  {n:"Helsinki",k:"Stadt",lat:60.17,lng:24.94},
  {n:"Angerstraße, Ravensburg-Weststadt",q:"Wo ist Daniel aufgewachsen?",k:"Straße",lat:47.781,lng:9.590},   // q = eigene Frage statt „Wo ist …?“
  {n:"Bangkok",k:"Stadt",lat:13.76,lng:100.50},
  {n:"Buenos Aires",k:"Stadt",lat:-34.60,lng:-58.38},
  {n:"Kaliningrad",k:"Stadt",lat:54.71,lng:20.51},
  {n:"New York",k:"Stadt",lat:40.71,lng:-74.01},
  {n:"Sevilla",k:"Stadt",lat:37.39,lng:-5.99}
];
const TIMER_SECONDS = 20; // Zeit zum Tippen, wenn der Spielleiter den Timer startet
const WIN_POINTS = 4; // Best of 7

/* ===== Ab hier nichts ändern nötig ===== */
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const role = P.get("r") || "";                       // leiter | 1 | 2
const room = (P.get("raum") || "schlag-den-daniel-wo-ist").replace(/[^a-z0-9_-]/gi, "");
const N = {p1: P.get("n1") || "Daniel", p2: P.get("n2") || "Gäste"};
const me = role === "1" || role === "2" ? "p" + role : null;
const isLeiter = role === "leiter";

if (!role) {
  $("map").hidden = true; document.querySelector("footer").hidden = true;
  $("pick").hidden = false;
  const base = `?raum=${room}&n1=${encodeURIComponent(N.p1)}&n2=${encodeURIComponent(N.p2)}`;
  $("pick").innerHTML = `<a href="${base}&r=leiter">Spielleiter (großer Bildschirm)</a><a href="${base}&r=1" style="border-color:var(--p1)">${N.p1}</a><a href="${base}&r=2" style="border-color:var(--p2)">${N.p2}</a>`;
  throw new Error("Rolle wählen");
}
if (Object.values(CONFIG).some(v => v === "HIER")) {
  $("msg").textContent = "Firebase-Werte fehlen: oben in der Datei bei CONFIG eintragen.";
  $("q").textContent = "Einrichtung unvollständig";
  throw new Error("Config fehlt");
}

const db = getDatabase(initializeApp(CONFIG));
const sRef = ref(db, `rooms/${room}/state`), gRef = ref(db, `rooms/${room}/guess`);
let S = {}, G = {}, mine = null, lastKey = "", lastRound = -1, busy = false;
let offset = 0, shownSec = -1, ac = null;
onValue(ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });
const now = () => Date.now() + offset;
const left = () => S.phase === "guess" && S.deadline ? Math.max(0, (S.deadline - now()) / 1000) : null;
const timeUp = () => { const l = left(); return l !== null && l <= 0; };
function beep(f, d) { if (!ac) return; try { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = "square"; o.frequency.value = f; g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02); } catch (e) {} }
function startTimer() {
  if (!isLeiter || S.phase !== "guess") return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  update(sRef, {deadline: now() + TIMER_SECONDS * 1000}).catch(fail);
}
setInterval(() => {
  const l = left(), el = $("timer");
  el.hidden = l === null;
  if (l === null) { shownSec = -1; return; }
  const sec = Math.ceil(l);
  el.textContent = sec; el.classList.toggle("low", sec <= 5);
  if (sec !== shownSec) {
    if (isLeiter && sec > 0 && sec <= 5 && shownSec !== -1) beep(1000, .06);
    if (sec === 0 && shownSec > 0) { if (isLeiter) { beep(110, .6); reveal(); } render(); }
    shownSec = sec;
  }
}, 200);

const WORLD = [[-58, -170], [80, 180]];
const map = L.map("map", {minZoom: 0, maxZoom: 8, zoomSnap: .5,
  maxBounds: [[-85, -180], [85, 180]], maxBoundsViscosity: 1});
map.fitBounds(WORLD);
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution("NASA Blue Marble · GIBS");
// NASA Blue Marble: Satellitenlook mit Relief, ohne Beschriftung und ohne Grenzen (kostenlos, ohne Key)
const GIBS = [
  "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg",
  "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default//GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg",
  "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/EPSG3857_500m/{z}/{y}/{x}.jpeg"
];
let gi = 0, tilesOk = false;
const base = L.tileLayer(GIBS[0], {maxNativeZoom: 8, maxZoom: 8, noWrap: true, bounds: [[-85.05, -180], [85.05, 180]]}).addTo(map);
base.on("tileload", () => { tilesOk = true; });
base.on("tileerror", () => {
  if (tilesOk) return;
  if (gi < GIBS.length - 1) { gi++; base.setUrl(GIBS[gi]); }
  else $("msg").textContent = "Karte konnte nicht geladen werden. Seite neu laden.";
});
const layer = L.layerGroup().addTo(map);
const wrap = lng => ((lng + 540) % 360) - 180;
const km = (a, b) => {
  const r = x => x * Math.PI / 180, R = 6371;
  const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const dot = (ll, c, t) => L.circleMarker(ll, {radius: 11, color: "#fff", weight: 3, fillColor: c, fillOpacity: 1})
  .bindTooltip(t, {permanent: true, direction: "top"}).addTo(layer);

let dbErr = "";
const fail = e => { dbErr = /permission/i.test(e && (e.code || e.message) || "") ? "Datenbank verweigert den Zugriff. In Firebase die Regeln der Realtime Database prüfen." : "Datenbank-Fehler: " + (e && e.message || e); render(); };
window.addEventListener("unhandledrejection", e => fail(e.reason));
let conn = null;
onValue(ref(db, ".info/connected"), s => { conn = !!s.val(); render(); });
setTimeout(() => { if (!conn) { conn = false; render(); } }, 6000);
onValue(sRef, s => { S = s.val() || {}; render(); }, fail);
onValue(gRef, s => { G = s.val() || {}; render(); if (isLeiter && S.phase === "guess" && G.p1 && G.p2) reveal(); }, fail);

map.on("click", e => {
  if (!me || S.phase !== "guess" || G[me] || timeUp()) return;
  mine = {lat: e.latlng.lat, lng: wrap(e.latlng.lng)};
  render();
});

async function nextRound() {
  const used = S.used || [];
  let i, reset = false;
  if (!used.includes(0)) i = 0;                        // München = Probe-Runde zuerst
  else {
    let pool = PLACES.map((_, k) => k).filter(k => k > 0 && !used.includes(k));
    if (!pool.length) { pool = PLACES.map((_, k) => k).filter(k => k > 0); reset = true; }
    i = pool[Math.floor(Math.random() * pool.length)];
  }
  await remove(gRef);
  await update(sRef, {phase: "guess", idx: i, name: PLACES[i].n, ask: PLACES[i].q || null, kind: PLACES[i].k, probe: !!PLACES[i].probe,
    used: reset ? [0, i] : [...used, i],
    round: (S.round || 0) + 1, reveal: null, deadline: null, score: {p1: (S.score || {}).p1 || 0, p2: (S.score || {}).p2 || 0}});
}

async function reveal() {
  if (busy || S.phase !== "guess") return;
  busy = true;
  const t = PLACES[S.idx];
  const d1 = G.p1 ? km(t, G.p1) : 99999, d2 = G.p2 ? km(t, G.p2) : 99999;
  const probe = !!t.probe;
  const w = probe ? "" : d1 < d2 ? "p1" : d2 < d1 ? "p2" : "";
  const sc = {p1: (S.score || {}).p1 || 0, p2: (S.score || {}).p2 || 0};
  if (w) sc[w]++;
  await update(sRef, {phase: "reveal", deadline: null, score: sc, reveal: {lat: t.lat, lng: t.lng, d1: Math.round(d1), d2: Math.round(d2), w, probe}});
  busy = false;
}

const addPoint = async w => {
  const sc = {p1: (S.score || {}).p1 || 0, p2: (S.score || {}).p2 || 0}; sc[w]++;
  await update(sRef, {score: sc});
};

function render() {
  const sc = S.score || {}, s1 = sc.p1 || 0, s2 = sc.p2 || 0, ph = S.phase || "idle", R = S.reveal;
  const over = s1 >= WIN_POINTS || s2 >= WIN_POINTS;
  $("score").innerHTML = `<span style="color:var(--p1)">${N.p1} ${s1}</span> : <span style="color:var(--p2)">${s2} ${N.p2}</span>`;
  if ((S.round || 0) !== lastRound) { lastRound = S.round || 0; mine = null; map.fitBounds(WORLD); }

  layer.clearLayers();
  let q = "Bereit?", m = "";
  const dtxt = d => d >= 99999 ? "kein Tipp" : d.toLocaleString("de-DE") + " km";
  if (ph === "idle") {
    q = "Wo ist …?";
    m = isLeiter ? "Mit „Nächste Runde“ geht’s los." : "Warte auf den Spielleiter …";
  } else if (ph === "guess") {
    q = `${S.ask || `Wo ist ${S.name}?`}${S.probe ? " (Probe)" : ""}`;
    if (isLeiter) m = `${N.p1}: ${G.p1 ? "✓" : "…"}   ${N.p2}: ${G.p2 ? "✓" : "…"}`;
    else if (G[me]) { m = "Tipp abgegeben. Warte auf den Gegner …"; dot(G[me], me === "p1" ? "#ff7a1a" : "#2bdccb", "Dein Tipp"); }
    else if (mine) { m = "Marker verschieben oder Tipp abgeben."; dot(mine, me === "p1" ? "#ff7a1a" : "#2bdccb", "Dein Tipp"); }
    else m = "Tippe auf die Karte, wo du den Ort vermutest.";
  } else if (ph === "reveal" && R) {
    q = S.name;
    const pts = [[R.lat, R.lng]];
    dot([R.lat, R.lng], "#ffd24a", S.name);
    [["p1", "#ff7a1a", R.d1], ["p2", "#2bdccb", R.d2]].forEach(([k, c, d]) => {
      if (!G[k]) return;
      dot(G[k], c, `${N[k]}: ${dtxt(d)}`);
      L.polyline([[R.lat, R.lng], [G[k].lat, G[k].lng]], {color: c, weight: 3, dashArray: "6 6"}).addTo(layer);
      pts.push([G[k].lat, G[k].lng]);
    });
    m = `${N.p1}: ${dtxt(R.d1)} · ${N.p2}: ${dtxt(R.d2)} → ${R.probe ? "Probe, kein Punkt" : R.w ? "Punkt für " + N[R.w] : "Unentschieden"}`;
    const key = S.round + "r";
    if (key !== lastKey) { lastKey = key; map.fitBounds(pts, {padding: [60, 60], maxZoom: 6}); }
  }
  if (over) m += `   🏆 ${s1 > s2 ? N.p1 : N.p2} gewinnt!`;
  $("q").textContent = q; $("msg").textContent = dbErr || (conn === false ? "Keine Verbindung zur Datenbank. Internet prüfen. Sonst gibt es die Firebase-Datenbank nicht mehr." : m);

  $("bSubmit").hidden = !me; $("bSubmit").disabled = !(me && ph === "guess" && mine && !G[me] && !timeUp());
  if (me && ph === "guess" && !G[me] && timeUp()) $("msg").textContent = "Die Zeit ist um.";
  $("bTimer").hidden = !isLeiter; $("bTimer").disabled = !(ph === "guess" && !S.deadline);
  [["bNext"], ["bReveal"], ["bP1"], ["bP2"], ["bReset"]].forEach(([b]) => $(b).hidden = !isLeiter);
  $("bNext").disabled = ph === "guess" || over;
  $("bReveal").disabled = !(ph === "guess" && (G.p1 || G.p2));
  $("bP1").textContent = `+1 ${N.p1}`; $("bP2").textContent = `+1 ${N.p2}`;
}

$("bSubmit").onclick = () => { if (mine && !timeUp()) set(ref(db, `rooms/${room}/guess/${me}`), mine).catch(fail); };
$("bNext").onclick = () => { const t = setTimeout(() => fail({message: "Die Datenbank antwortet nicht."}), 6000); nextRound().then(() => { clearTimeout(t); if (dbErr) { dbErr = ""; render(); } }, e => { clearTimeout(t); fail(e); }); };
$("bReveal").onclick = reveal;
$("bTimer").onclick = startTimer;
if (isLeiter) document.addEventListener("keydown", e => { if ((e.key === "t" || e.key === "T") && !e.metaKey && !e.ctrlKey) startTimer(); });
$("bP1").onclick = () => addPoint("p1");
$("bP2").onclick = () => addPoint("p2");
$("bReset").onclick = () => { if (confirm("Spiel wirklich zurücksetzen?")) remove(ref(db, `rooms/${room}`)); };
render();
</script>
</body>
</html>
