<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schlag den Daniel – Regie</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --accent: #f59e0b;
        --accent-2: #22c55e;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app {
        width: min(95vw, 880px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        padding: 28px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 3.4rem);
        text-align: center;
      }
      .info {
        color: var(--muted);
        margin-bottom: 22px;
        text-align: center;
        font-size: 1.05rem;
      }
      .regie-toggle {
        position: fixed;
        right: 18px;
        top: 18px;
        background: var(--panel-alt);
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--text);
        padding: 10px 16px;
        border-radius: 999px;
        cursor: pointer;
      }
      .panel {
        display: grid;
        gap: 16px;
      }
      .hidden {
        display: none;
      }
      .field {
        display: grid;
        gap: 10px;
      }
      label {
        font-weight: 700;
        font-size: 1.1rem;
      }
      input {
        width: 100%;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        background: rgba(15, 23, 42, 0.7);
        color: var(--text);
      }
      .output {
        border-radius: 14px;
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.44);
        padding: 16px;
      }
      .output strong {
        display: block;
        margin-bottom: 8px;
        color: #bbf7d0;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a.button,
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
        transition: transform 0.14s ease;
      }
      a.button:hover,
      button:hover {
        transform: translateY(-1px);
      }
      .primary {
        background: var(--accent);
        color: #111827;
      }
      .secondary {
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid rgba(148,163,184,0.3);
        color: var(--text);
      }
      .status {
        min-height: 24px;
        font-weight: 700;
        color: var(--muted);
      }
      .status.ok { color: #bbf7d0; }
      .status.err { color: #fca5a5; }
      @media (max-width: 560px) {
        .app { padding: 18px; }
        .links { flex-direction: column; }
        a.button, button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <button class="regie-toggle" id="toggleRegie" type="button">Regie</button>

    <main class="app" id="regiePanel">
      <h1>Schlag den Daniel</h1>
      <div class="info">Eingabe in der Regie. Die Buzzer-Adresse wird automatisch aus der Show-Adresse abgeleitet.</div>

      <div class="panel">
        <div class="field">
          <label for="showUrl">Adresse von wo-ist.html</label>
          <input id="showUrl" type="url" placeholder="https://DEINNAME.github.io/schlag-den-daniel/wo-ist.html" />
        </div>

        <div class="output">
          <strong>Buzzer-Adresse</strong>
          <div id="buzzerUrl">Noch nicht gesetzt</div>
        </div>

        <div class="status" id="statusText"></div>

        <div class="links">
          <a class="button primary" id="openShow" href="#" target="_blank" rel="noopener noreferrer">wo-ist.html öffnen</a>
          <a class="button secondary" id="openBuzzer" href="#" target="_blank" rel="noopener noreferrer">buzzer.html öffnen</a>
        </div>
      </div>
    </main>

    <script>
      const showInput = document.getElementById('showUrl');
      const buzzerOutput = document.getElementById('buzzerUrl');
      const openShow = document.getElementById('openShow');
      const openBuzzer = document.getElementById('openBuzzer');
      const statusText = document.getElementById('statusText');
      const toggleRegie = document.getElementById('toggleRegie');
      const regiePanel = document.getElementById('regiePanel');

      function setStatus(message, isOk = true) {
        statusText.textContent = message;
        statusText.className = 'status ' + (isOk ? 'ok' : 'err');
      }

      function deriveUrls(showValue) {
        if (!showValue) return { show: '', buzzer: '' };
        const trimmed = showValue.trim();

        if (!/^https?:\/\//i.test(trimmed)) {
          return { show: '', buzzer: '' };
        }

        const normalized = trimmed.replace(/\/wo-ist\.html$/i, '').replace(/\/$/, '');
        return {
          show: trimmed,
          buzzer: normalized + '/buzzer.html'
        };
      }

      function updateFromInput() {
        const { show, buzzer } = deriveUrls(showInput.value);

        if (!show || !buzzer) {
          buzzerOutput.textContent = 'Noch nicht gesetzt';
          openShow.href = '#';
          openBuzzer.href = '#';
          setStatus('Bitte eine gültige URL für wo-ist.html eintragen.', false);
          return;
        }

        buzzerOutput.textContent = buzzer;
        openShow.href = show;
        openBuzzer.href = buzzer;

        localStorage.setItem('schlagDenDanielShowUrl', show);
        localStorage.setItem('schlagDenDanielBuzzerUrl', buzzer);

        setStatus('Buzzer-Adresse aktualisiert.', true);
      }

      const defaultShowUrl = `${location.origin}${location.pathname.replace(/\/[^/]*$/, '')}/wo-ist.html`;
      showInput.value = localStorage.getItem('schlagDenDanielShowUrl') || defaultShowUrl;
      updateFromInput();
      showInput.addEventListener('input', updateFromInput);

      toggleRegie.addEventListener('click', () => {
        regiePanel.classList.toggle('hidden');
      });

      document.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() === 'h') {
          regiePanel.classList.toggle('hidden');
        }
      });
    </script>
  </body>
</html>
