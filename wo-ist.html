<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wo ist Daniel?</title>
    <style>
      :root {
        --bg: #020617;
        --panel: #0f172a;
        --text: #e2e8f0;
        --accent: #fbbf24;
        --accent-2: #22c55e;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #020617 60%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .frame {
        width: min(92vw, 980px);
        text-align: center;
        background: rgba(15,23,42,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 24px;
        padding: 24px 20px 30px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      }
      h1 {
        font-size: clamp(2.8rem, 8vw, 8rem);
        line-height: 0.9;
        margin: 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .subtitle {
        margin-top: 18px;
        font-size: clamp(1.1rem, 3vw, 1.8rem);
        color: #cbd5e1;
      }
      .last-buzz {
        margin-top: 28px;
        padding: 16px 20px;
        border-radius: 14px;
        background: rgba(34, 197, 94, 0.08);
        border: 1px solid rgba(34, 197, 94, 0.38);
        font-size: 1.05rem;
        color: #d1fae5;
      }
      .pulse {
        animation: glow 1.4s ease-in-out infinite alternate;
      }
      @keyframes glow {
        from { box-shadow: 0 0 0 rgba(251, 191, 36, 0.1); }
        to { box-shadow: 0 0 30px rgba(251, 191, 36, 0.45); }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <h1>Wo ist Daniel?</h1>
      <div class="subtitle">Buzzer-Aktivität anzeigen</div>
      <div id="lastBuzz" class="last-buzz pulse">Noch kein Buzzer aktiviert.</div>
    </div>

    <script>
      const lastBuzz = document.getElementById('lastBuzz');

      function renderBuzz(data) {
        if (!data) {
          lastBuzz.textContent = 'Noch kein Buzzer aktiviert.';
          return;
        }

        const date = new Date(data.time);
        const time = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        lastBuzz.textContent = `Letzter Buzzer: ${time} Uhr`;
      }

      function readBuzz() {
        const raw = localStorage.getItem('schlagDenDanielBuzz');
        if (!raw) {
          renderBuzz(null);
          return;
        }

        try {
          renderBuzz(JSON.parse(raw));
        } catch (error) {
          renderBuzz(null);
        }
      }

      readBuzz();
      window.addEventListener('storage', (event) => {
        if (event.key === 'schlagDenDanielBuzz') {
          readBuzz();
        }
      });
    </script>
  </body>
</html>
