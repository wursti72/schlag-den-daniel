<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buzzer</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #0f172a;
        --accent: #ef4444;
        --accent-2: #f59e0b;
        --text: #f8fafc;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1f2937, var(--bg));
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .wrap {
        width: min(92vw, 680px);
        text-align: center;
      }
      button {
        width: 100%;
        min-height: 320px;
        border: 0;
        border-radius: 24px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        font-size: clamp(2rem, 7vw, 5rem);
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 28px 60px rgba(239, 68, 68, 0.35);
        transition: transform 0.12s ease, filter 0.12s ease;
      }
      button:active {
        transform: scale(0.98);
        filter: brightness(1.08);
      }
      .caption {
        margin-top: 22px;
        font-size: 1.1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <button id="buzzerButton" type="button">Buzzer</button>
      <div class="caption">Drücke, wenn du antworten kannst.</div>
    </div>

    <script>
      const button = document.getElementById('buzzerButton');

      button.addEventListener('click', () => {
        const payload = {
          time: Date.now(),
          id: Math.random().toString(36).slice(2, 9)
        };

        localStorage.setItem('schlagDenDanielBuzz', JSON.stringify(payload));
        button.textContent = 'Gedrückt!';
        button.disabled = true;
        setTimeout(() => {
          button.textContent = 'Buzzer';
          button.disabled = false;
        }, 1400);
      });
    </script>
  </body>
</html>
